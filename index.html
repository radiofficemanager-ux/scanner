<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kiosk Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;
  background:#0a0f1e;color:#f1f5f9;overflow:hidden;touch-action:manipulation}
.pg{display:none;min-height:100svh;min-height:100vh;flex-direction:column;
  align-items:center;justify-content:center;padding:clamp(1rem,4vw,2rem)}
.pg.on{display:flex}
#pg-scan{padding:0;background:#000}
.card{background:#0f172a;border:1px solid #1e293b;
  border-radius:clamp(12px,3vw,20px);padding:clamp(1.25rem,4vw,2rem);
  width:100%;max-width:440px}
.lbl{display:block;font-size:clamp(.7rem,2.5vw,.82rem);font-weight:700;
  color:#475569;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.35rem}
select,input[type=text],input[type=password]{
  width:100%;padding:clamp(.75rem,3vw,1rem);border:2px solid #1e293b;
  border-radius:10px;background:#020617;color:#f1f5f9;
  font-size:clamp(.95rem,3.5vw,1.05rem);outline:none;
  appearance:none;-webkit-appearance:none;margin-bottom:.65rem}
select:focus,input:focus{border-color:#38bdf8}
.pin{font-size:clamp(1.8rem,7vw,2.2rem)!important;letter-spacing:.5rem;
  text-align:center;font-weight:800}
select[size]{height:auto;padding:.25rem 0!important;font-size:clamp(.85rem,3vw,1rem)!important}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;
  width:100%;padding:clamp(.9rem,3.5vw,1.1rem);border:none;
  border-radius:clamp(10px,2.5vw,14px);font-size:clamp(1rem,3.8vw,1.1rem);
  font-weight:800;cursor:pointer;margin-bottom:.5rem;
  min-height:clamp(50px,12vw,60px);user-select:none}
.btn-blue{background:#38bdf8;color:#0f172a}
.btn-blue:active{background:#0ea5e9}
.btn-gray{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.btn-gray:active{background:#334155}
#pg-login{background:linear-gradient(160deg,#0f172a,#0c1a3a)}
.logo{text-align:center;margin-bottom:clamp(1rem,4vw,1.5rem)}
.logo .ico{font-size:clamp(2.5rem,10vw,3.5rem)}
.logo h1{font-size:clamp(1.1rem,4.5vw,1.4rem);font-weight:800;color:#38bdf8;margin-top:.4rem}
.logo p{font-size:clamp(.75rem,2.8vw,.9rem);color:#475569}
.err{color:#f87171;font-size:clamp(.78rem,2.8vw,.88rem);
  text-align:center;min-height:1.2rem;margin-bottom:.4rem;
  word-break:break-all;line-height:1.5}
#pg-setup{justify-content:flex-start;padding-top:clamp(1rem,4vw,2rem);overflow-y:auto}
.setup-title{font-size:clamp(.95rem,3.8vw,1.1rem);font-weight:800;
  color:#38bdf8;text-align:center;margin-bottom:clamp(.75rem,3vw,1.25rem)}
.sc-hdr{position:absolute;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;gap:.4rem;
  padding:clamp(.4rem,2vw,.65rem) clamp(.5rem,2vw,.8rem);
  background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sc-bdg{display:flex;gap:.3rem;flex:1;flex-wrap:wrap;min-width:0;overflow:hidden}
.bdg{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);
  border-radius:20px;padding:.2rem .55rem;
  font-size:clamp(.62rem,2.3vw,.78rem);font-weight:700;color:#7dd3fc;
  white-space:nowrap;max-width:28vw;overflow:hidden;text-overflow:ellipsis}
.hdr-btn{flex-shrink:0;padding:clamp(.45rem,2vw,.6rem) clamp(.75rem,3vw,1rem);
  border:1.5px solid rgba(255,255,255,.2);border-radius:8px;
  background:rgba(255,255,255,.1);color:#fff;
  font-size:clamp(.78rem,3vw,.92rem);font-weight:800;
  min-height:clamp(44px,10vw,52px);min-width:clamp(55px,13vw,75px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none}
.hdr-btn.exit{background:rgba(239,68,68,.25);
  border-color:rgba(239,68,68,.45);color:#fca5a5}
.hdr-btn:active{transform:scale(.93)}
.hdr-btn.active-mode{background:rgba(56,189,248,.3);border-color:rgba(56,189,248,.6);color:#38bdf8}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas#qc{display:none}
.qr-box{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-60%);
  width:min(62vw,260px);height:min(62vw,260px);
  border:2.5px solid #38bdf8;border-radius:14px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.48);z-index:10;pointer-events:none}
.scan-line{position:absolute;left:4%;right:4%;height:2px;
  background:linear-gradient(90deg,transparent,#38bdf8,transparent);
  animation:sl 1.8s ease-in-out infinite}
@keyframes sl{0%,100%{top:6%;opacity:.5}50%{top:88%;opacity:1}}
.sc-foot{position:absolute;bottom:0;left:0;right:0;z-index:100;
  background:rgba(0,0,0,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:clamp(.65rem,2.5vw,.9rem) clamp(.75rem,3vw,1rem) clamp(.9rem,4vw,1.2rem)}
.cnt{font-size:clamp(2.5rem,11vw,4rem);font-weight:900;
  color:#38bdf8;line-height:1;text-align:center}
.cnt-lbl{font-size:clamp(.62rem,2.5vw,.75rem);text-transform:uppercase;
  letter-spacing:.1em;color:#334155;text-align:center;margin-bottom:.4rem}
.last{font-size:clamp(.75rem,2.8vw,.9rem);color:#475569;
  font-family:monospace;text-align:center;margin-bottom:.5rem;min-height:1.1rem}
.status{padding:clamp(.6rem,2.5vw,.8rem);border-radius:10px;
  font-size:clamp(.85rem,3.2vw,1rem);font-weight:700;text-align:center;
  min-height:clamp(44px,10vw,52px);display:flex;align-items:center;justify-content:center}
.s-idle{background:rgba(255,255,255,.05);color:#334155}
.s-ok  {background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#86efac}
.s-dup {background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
.s-err {background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:900;transition:opacity .2s}
#flash.ok{background:rgba(34,197,94,.55)}
#flash.err{background:rgba(239,68,68,.5)}
#flash.dup{background:rgba(245,158,11,.45)}
.fon{opacity:1!important}

/* Siker overlay - nagy szöveg a visszajelzéshez */
#scan-ok-overlay{
  position:fixed;inset:0;z-index:800;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;
}
#scan-ok-overlay.show{opacity:1}
.ok-icon{font-size:clamp(5rem,20vw,9rem);line-height:1}
.ok-text{font-size:clamp(1.5rem,6vw,3rem);font-weight:900;color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,.5);margin-top:.5rem;text-align:center}
#toast{position:fixed;top:clamp(.5rem,2vw,.75rem);left:50%;
  transform:translateX(-50%);z-index:999;background:#1e293b;color:#f1f5f9;
  padding:clamp(.6rem,2.5vw,.8rem) clamp(1rem,3.5vw,1.4rem);border-radius:10px;
  font-size:clamp(.82rem,3vw,.95rem);font-weight:600;
  box-shadow:0 4px 20px rgba(0,0,0,.6);max-width:92vw;text-align:center;
  pointer-events:none;transition:opacity .25s;opacity:0}
#toast.on{opacity:1}
.spin{display:inline-block;width:1em;height:1em;
  border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-.1em;margin-right:.3rem}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="flash"></div>
<div id="toast"></div>
<div id="scan-ok-overlay">
  <div class="ok-icon">✅</div>
  <div class="ok-text" id="ok-text"></div>
</div>

<!-- LOGIN -->
<div class="pg on" id="pg-login">
  <div class="card">
    <div class="logo">
      <div class="ico">🏭</div>
      <h1>Gyártásnyomkövető</h1>
      <p>Kiosk belépés</p>
    </div>
    <label class="lbl">Gyártósor</label>
    <select id="m-gy"><option value="">Betöltés...</option></select>
    <label class="lbl">PIN kód</label>
    <input id="m-pin" type="password" inputmode="numeric"
      maxlength="4" class="pin" placeholder="●●●●" autocomplete="off">
    <div class="err" id="m-err"></div>
    <button class="btn btn-blue" id="btn-login">⚡ Belépés</button>
  </div>
</div>

<!-- SETUP -->
<div class="pg" id="pg-setup">
  <div class="card">
    <div class="setup-title">⚙️ Állomás beállítása</div>
    <label class="lbl">Fázis</label>
    <select id="m-faz"><option value="">— Válassz —</option></select>
    <!-- Termék: csak Sorvége fázisnál -->
    <div id="termek-row" style="display:none">
      <label class="lbl">Termék kiválasztása <span style="color:#f87171">*kötelező</span></label>
      <input id="m-tsrch" type="text" placeholder="Cikkszám vagy termék neve...">
      <select id="m-cs" size="4"></select>
    </div>
    <!-- Sokkoló: csak Sokkolás fázisnál -->
    <div id="sokkolo-row" style="display:none">
      <label class="lbl" style="margin-top:.5rem">
        Melyik sokkolóba tolják?
        <span style="color:#f87171;font-size:.75rem"> * kötelező</span>
      </label>
      <select id="m-sk" style="font-size:clamp(1rem,3.8vw,1.1rem);font-weight:700">
        <option value="">— Válassz sokkolót —</option>
      </select>
    </div>
    <button class="btn btn-blue" id="btn-start" style="margin-top:.75rem">▶ Olvasó indítása</button>
    <button class="btn btn-gray" id="btn-back">← Vissza</button>
  </div>
</div>

<!-- SCANNER -->
<div class="pg" id="pg-scan">
  <div class="sc-hdr">
    <div class="sc-bdg" id="m-bdg"></div>
    <button class="hdr-btn" id="btn-stp">⚙️</button>
    <button class="hdr-btn exit" id="btn-exit">🚪 Ki</button>
  </div>
  <video id="qv" autoplay playsinline muted></video>
  <canvas id="qc"></canvas>
  <div class="qr-box"><div class="scan-line"></div></div>
  <div class="sc-foot">
    <div style="display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:.3rem">
      <div style="text-align:center">
        <div class="cnt" id="m-cnt">0</div>
        <div class="cnt-lbl">leolvasás</div>
      </div>
      <div style="text-align:center;min-width:100px">
        <div style="font-size:clamp(.65rem,2.5vw,.78rem);color:#334155;text-transform:uppercase;letter-spacing:.08em">Utolsó kocsi</div>
        <div id="m-last" style="font-size:clamp(.9rem,3.5vw,1.1rem);font-weight:800;font-family:monospace;color:#7dd3fc;min-height:1.4rem"></div>
        <div id="m-termek" style="font-size:clamp(.65rem,2.3vw,.75rem);color:#475569;min-height:1rem"></div>
      </div>
    </div>
    <div class="status s-idle" id="m-st">Tartsd a QR kódot a keretbe</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// !! ÍRD BE A GAS URL-T !!
// ═══════════════════════════════════════════════════
// ── HANGJELZÉS + REZGÉS ────────────────────────────────────
function beepOK() {
  try {
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,130].forEach(function(d){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;o.type='sine';
      var t=ctx.currentTime+d/1000;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.4,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t);o.stop(t+0.2);
    });
  } catch(e){}
  if(navigator.vibrate)navigator.vibrate([80,40,80]);
}
function beepERR() {
  try {
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=200;o.type='sawtooth';
    g.gain.setValueAtTime(0.35,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
    o.start();o.stop(ctx.currentTime+0.5);
  } catch(e){}
  if(navigator.vibrate)navigator.vibrate([300]);
}
function beepDUP() {
  try {
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,160,320].forEach(function(d){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=550;o.type='triangle';
      var t=ctx.currentTime+d/1000;
      g.gain.setValueAtTime(0.2,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      o.start(t);o.stop(t+0.12);
    });
  } catch(e){}
  if(navigator.vibrate)navigator.vibrate([50,50,50]);
}

var GAS_URL = 'https://script.google.com/macros/s/AKfycbwRIhFZnwY2RkA_WdBu-mnlyTSV6muaaJH2a_lgTlhgzU1UQuZ1nc6N5OYlaUAd55az/exec';
// ═══════════════════════════════════════════════════

window.onerror = function(msg,s,l){ showToast('JS hiba: '+msg+' L'+l,5000); };

var S = {
  token:null,gy:null,faz:null,cs:null,sk:null,
  cnt:0,busy:false,stream:null,raf:null,md:null,termekek:[]
};

// ── JSONP API - CORS-mentes, minden domainről működik ──
function api(action, params) {
  return new Promise(function(resolve, reject) {
    // Egyedi callback név
    var cbName = '_gcb' + Date.now() + Math.floor(Math.random()*1000);

    // URL összerakása
    var url = GAS_URL + '?callback=' + cbName + '&action=' + encodeURIComponent(action);
    var p   = Object.assign({}, params || {});
    if (S.token) p.token = S.token;
    for (var k in p) {
      url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(p[k] !== undefined ? p[k] : '');
    }

    // Timeout (10 mp)
    var timer = setTimeout(function() {
      cleanup();
      reject(new Error('Időtúllépés - próbáld újra'));
    }, 20000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      var s = document.getElementById(cbName);
      if (s && s.parentNode) s.parentNode.removeChild(s);
    }

    // Callback regisztrálása
    window[cbName] = function(data) {
      cleanup();
      if (data && data.ok === false) {
        reject(new Error(data.error || 'Szerverhiba'));
      } else {
        resolve(data && data.result !== undefined ? data.result : data);
      }
    };

    // Script tag injektálás (JSONP)
    var script = document.createElement('script');
    script.id  = cbName;
    script.src = url;
    script.onerror = function() {
      cleanup();
      reject(new Error('Hálózati hiba. GAS URL helyes?'));
    };
    document.head.appendChild(script);
  });
}

// apiPost = api (JSONP mindkettő)
function apiPost(action, data) {
  return api(action, data);
}

var _tt;
function showToast(msg,ms){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(function(){el.classList.remove('on');},ms||2500);
}
function doFlash(type){
  var el=document.getElementById('flash');
  el.className=type+' fon';
  setTimeout(function(){el.classList.remove('fon');},type==='ok'?350:250);
}
function showPg(id){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
  document.getElementById(id).classList.add('on');
}
var _okTimer;
function showScanOK(text) {
  var ov  = document.getElementById('scan-ok-overlay');
  var txt = document.getElementById('ok-text');
  if (!ov) return;
  if (txt) txt.textContent = text;
  ov.classList.add('show');
  clearTimeout(_okTimer);
  _okTimer = setTimeout(function() { ov.classList.remove('show'); }, 800);
}

function setStatus(type,msg){
  var el=document.getElementById('m-st');
  el.className='status s-'+type; el.textContent=msg;
}
function showErr(msg){ var el=document.getElementById('m-err'); el.textContent=msg; }
function saveSes(){
  try{localStorage.setItem('ks2',JSON.stringify({
    token:S.token,gy:S.gy,faz:S.faz,cs:S.cs,sk:S.sk,ts:Date.now(),
    cnt:S.cnt  // leolvasásszám megőrzése
  }));}catch(e){}
}
function clearSes(){
  try{localStorage.removeItem('ks2');}catch(e){}
  S.token=S.gy=S.faz=S.cs=S.sk=null; S.cnt=0;
}

// LOGIN
function loadGy(){
  showErr('');
  if(S.md){ fillGySel(S.md); return; } // cache
  var sel=document.getElementById('m-gy');
  sel.innerHTML='<option>Betöltés...</option>';
  api('getMasterData').then(function(d){
    S.md=d; fillGySel(d);
  }).catch(function(e){
    var sel2=document.getElementById('m-gy');
    if(sel2) sel2.innerHTML='<option value="">Hiba!</option>';
    showErr('Hiba: '+e.message);
  });
}
function fillGySel(d){
  var sel=document.getElementById('m-gy'); if(!sel)return;
  sel.innerHTML='<option value="">Válassz gyártósort...</option>';
  (d.gyartosok||[]).forEach(function(g){
    var o=document.createElement('option');
    o.value=o.textContent=g['Nev']||g['Nev']||g['Név']||'';
    sel.appendChild(o);
  });
}

function doLogin(){
  var gy=document.getElementById('m-gy').value;
  var pin=document.getElementById('m-pin').value;
  var btn=document.getElementById('btn-login');
  showErr('');
  if(!gy){showErr('Válassz gyártósort!');return;}
  if(pin.length!==4){showErr('4 számjegyű PIN kell!');return;}
  btn.innerHTML='<span class="spin"></span>Belépés...'; btn.disabled=true;
  apiPost('kioszkLogin',{gyartosor:gy,pin:pin}).then(function(r){
    S.token=r.token; S.gy=r.gyartosor; saveSes();
    fillSetup(); showPg('pg-setup');
    showToast('Üdvözöljük! Műszak: '+r.muszak);
  }).catch(function(e){
    var msg = (e && e.message) ? e.message : 'Ismeretlen hiba';
    // GAS hibák fordítása
    if (msg.indexOf('Hibás PIN') >= 0 || msg.toLowerCase().indexOf('pin') >= 0) {
      showErr('❌ Hibás PIN kód! ' + msg.replace('Hibás PIN.','').trim());
    } else if (msg.indexOf('Zárolva') >= 0 || msg.indexOf('zárolva') >= 0) {
      showErr('🔒 Eszköz zárolva! Admin segítség szükséges.');
    } else if (msg.indexOf('Nincs aktív') >= 0) {
      showErr('⚠️ Nincs regisztrált eszköz ehhez a gyártósorhoz.');
    } else {
      showErr('❌ ' + msg);
    }
    document.getElementById('m-pin').value='';
  }).finally(function(){btn.innerHTML='⚡ Belépés'; btn.disabled=false;});
}

// SETUP
function norm_s(s) {
  if (!s) return '';
  return String(s).toLowerCase()
    .replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i')
    .replace(/[óöő]/g,'o').replace(/[úüű]/g,'u')
    .replace(/[^a-z0-9]/g,'');
}

function fillSetup(){
  var d=S.md;
  if(!d){
    api('getMasterData').then(function(md){S.md=md;fillSetup();})
      .catch(function(e){showToast('Betöltési hiba: '+e.message,4000);});
    return;
  }
  // Gyártósor label
  var gyLbl=document.getElementById('setup-gy-label');
  if(gyLbl) gyLbl.textContent=S.gy||'—';
  var fs=document.getElementById('m-faz');
  fs.innerHTML='<option value="">— Válassz fázist —</option>';
  (d.fazisok||[]).sort(function(a,b){return(+a['Sorrend']||0)-(+b['Sorrend']||0);})
    .forEach(function(f){
      var o=document.createElement('option');
      o.value=o.textContent=f['Nev']||f['Név']||'';
      if(S.faz&&o.value===S.faz)o.selected=true;
      fs.appendChild(o);
    });
  var ss = document.getElementById('m-sk');
  if (ss) {
    var skGep = d.sokkolo_gep || [];
    ss.innerHTML = '<option value="">— Válassz sokkolót —</option>';
    skGep.forEach(function(n, i) {
      var o = document.createElement('option');
      o.value = n;
      o.textContent = (i + 1) + '. ' + n;
      if (S.sk && S.sk === n) o.selected = true;
      ss.appendChild(o);
    });
    if (skGep.length === 0) {
      ss.innerHTML += '<option disabled>⚠️ Nincs sokkoló konfigurálva</option>';
    }
  }
  S.termekek=(d.termekek||[]).filter(function(t){return t.Aktiv!==false;});
  filterT(''); updSkRow();
}

function filterT(q){
  var sel=document.getElementById('m-cs');
  q=(q||'').toLowerCase();
  var list=q?S.termekek.filter(function(t){
    return(t.Cikkszam||'').toLowerCase().indexOf(q)>=0||
           (t.Nev||'').toLowerCase().indexOf(q)>=0;
  }):S.termekek;
  sel.innerHTML='<option value="">(nincs termék)</option>';
  list.forEach(function(t){
    var o=document.createElement('option');
    o.value=t.Cikkszam||'';
    o.textContent=(t.Cikkszam||'')+' – '+(t.Nev||'');
    if(S.cs&&o.value===S.cs)o.selected=true;
    sel.appendChild(o);
  });
}

function updSkRow(){
  var fazEl = document.getElementById('m-faz');
  if (!fazEl) return;
  var faz        = fazEl.value || '';
  var fazN       = norm_s(faz);  // ELŐSZÖR definiáljuk!
  var isSorvege  = fazN.indexOf('sorveg') >= 0;
  var isSokkolas = fazN.indexOf('sokkol') >= 0;
  var tRow = document.getElementById('termek-row');
  var sRow = document.getElementById('sokkolo-row');
  if (tRow) tRow.style.display = isSorvege  ? '' : 'none';
  if (sRow) sRow.style.display = isSokkolas ? '' : 'none';
  if (!isSorvege) {
    var cs = document.getElementById('m-cs');
    if (cs) cs.innerHTML = '<option value="">(auto – rendszer keresi)</option>';
    S.cs = '';
  }
}

function doStart(){
  var faz = document.getElementById('m-faz') ? document.getElementById('m-faz').value : '';
  var cs  = document.getElementById('m-cs')  ? document.getElementById('m-cs').value  : '';
  var sk  = document.getElementById('m-sk')  ? document.getElementById('m-sk').value  : '';
  var fn  = norm_s(faz);
  var isSorvege  = fn.indexOf('sorveg') >= 0;
  var isSokkolas = fn.indexOf('sokkol') >= 0;
  if (!faz)                    { showToast('Válassz fázist!'); return; }
  if (isSorvege  && !cs)       { showToast('Sorvégén kötelező a termék kiválasztása!'); return; }
  if (isSokkolas && !sk)       { showToast('Sokkoláshoz válassz sokkoló gépet!'); return; }
  S.faz=faz; S.cs=isSorvege?cs:''; S.sk=isSokkolas?sk:'';
  saveSes(); goScan();
}

// SCANNER
function goScan(){
  var b=document.getElementById('m-bdg');
  b.innerHTML=
    '<span class="bdg">🏭 '+S.gy+'</span>'+
    '<span class="bdg">🔄 '+S.faz+'</span>'+
    (S.sk?'<span class="bdg">🧊 '+S.sk+'</span>':'')+
    (S.cs?'<span class="bdg">📦 '+S.cs+'</span>':'');
  // Scan szám visszatöltése localStorage-ból (frissítés után is megmarad)
  try {
    var savedCnt = localStorage.getItem('scan_cnt_' + S.gy);
    if (savedCnt) S.cnt = parseInt(savedCnt) || 0;
  } catch(e) {}
  document.getElementById('m-cnt').textContent=S.cnt;
  document.getElementById('m-last').textContent='';
  var tEl=document.getElementById('m-termek'); if(tEl) tEl.textContent='';
  setStatus('idle','Tartsd a QR kódot a keretbe');
  showPg('pg-scan');
  startCam();
}

function startCam(){
  stopCam();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    setStatus('err','Kamera API nem elérhető!'); return;
  }
  navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'environment'},width:{ideal:640,max:1280},height:{ideal:480,max:720}}
  }).then(function(stream){
    S.stream=stream;
    var v=document.getElementById('qv');
    v.srcObject=stream; v.play().catch(function(){});
    v.addEventListener('loadedmetadata',startDecode,{once:true});
    setStatus('idle','Tartsd a QR kódot a keretbe');
  }).catch(function(e){
    setStatus('err','Kamera: '+( e.name||e.message));
    showToast('Kamera hiba: '+(e.name||e.message),4000);
  });
}

function stopCam(){
  if(S.raf){cancelAnimationFrame(S.raf);S.raf=null;}
  if(S.stream){S.stream.getTracks().forEach(function(t){t.stop();});S.stream=null;}
  var v=document.getElementById('qv'); if(v)v.srcObject=null;
}

var _hidBuf='', _hidTimer=null;



function startDecode(){
  var _fr=0;
  var v=document.getElementById('qv'),c=document.getElementById('qc'),ctx=c.getContext('2d'),last='';
  function tick(){
    S.raf=requestAnimationFrame(tick);
    if(++_fr%2!==0)return; // 30fps elegendő
    if(!S.stream||v.readyState<v.HAVE_ENOUGH_DATA)return;
    c.width=v.videoWidth; c.height=v.videoHeight;
    ctx.drawImage(v,0,0);
    var d=ctx.getImageData(0,0,c.width,c.height);
    var qr=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});
    if(qr&&qr.data&&qr.data!==last){
      last=qr.data; setTimeout(function(){last='';},1500); onScan(qr.data);
    }
  }
  tick();
}

// Helyi duplikátum védelem
var _recentScans = [];

function onScan(raw){
  if(S.busy)return;
  var text=raw.trim().toUpperCase();
  if(!text||text.length<2)return;

  // HELYI duplikátum check (azonnali, nincs szerverhívás)
  var today=new Date().toDateString();
  var key=text+'_'+S.gy+'_'+S.faz+'_'+today;
  if(_recentScans.indexOf(key)>=0){
    setStatus('dup','⚠️ Mar leolvasva ma: '+text);
    beepDUP(); doFlash('dup'); return;
  }
  _recentScans.push(key);
  if(_recentScans.length>100)_recentScans.shift();

  // AZONNALI visszajelzés - nem várunk a szerverre
  S.busy=true;
  S.cnt++;
  document.getElementById('m-cnt').textContent=S.cnt;
  document.getElementById('m-last').textContent='Utolso: '+text;
  setStatus('ok','✅ '+text+' – Rogzítve');
  showScanOK(text); doFlash('ok'); beepOK();
  saveSes();

  // Háttérben szinkronizálás a szerverrel
  apiPost('submitScan',{kocsi_szam:text,gyartosor:S.gy,fazis:S.faz,cikkszam:S.cs||'',sokkolo:S.sk||''})
    .then(function(r){
      if(r && r.duplicate){
        // Szerver duplikált - visszavonjuk
        S.cnt--;
        document.getElementById('m-cnt').textContent=S.cnt;
        var ix=_recentScans.indexOf(key);
        if(ix>=0)_recentScans.splice(ix,1);
        setStatus('dup','⚠️ Szerver: már leolvasva: '+text);
        doFlash('dup'); beepDUP();
      } else if(r && r.ok) {
        // Frissítjük a termék infót ha a szerver megtalálta
        if(r.cikkszam) {
          var tEl=document.getElementById('m-termek');
          if(tEl) tEl.textContent='📦 '+r.cikkszam;
        }
        var lezMsg = r.eloz_lezarva ? ' ✓ Előző lezárva' : '';
        setStatus('ok','✅ '+text+' → '+S.faz+lezMsg);
      }
    }).catch(function(e){
      // Timeout/hálózat: helyi OK marad, de jelzés
      setStatus('ok','✅ '+text+' (szerver: '+(e.message||'timeout')+')');
    }).finally(function(){
      setTimeout(function(){S.busy=false;},300); // rövid cooldown
    });
}

function doExit(){
  stopCam(); clearSes(); showPg('pg-login');
  document.getElementById('m-pin').value='';
  showErr(''); loadGy();
}
function doSetupPg(){stopCam();fillSetup();showPg('pg-setup');}

// INIT
document.addEventListener('DOMContentLoaded',function(){
  function on(id,fn){
    var el=document.getElementById(id); if(!el)return;
    el.addEventListener('click',fn);
    el.addEventListener('touchend',function(e){e.preventDefault();fn();},{passive:false});
  }
  on('btn-login',doLogin);
  on('btn-start',doStart);
  on('btn-back',function(){showPg('pg-login');loadGy();});
  on('btn-exit',doExit);
  on('btn-stp',doSetupPg);
  document.getElementById('m-pin').addEventListener('input',function(){
    if(this.value.length===4)doLogin();
  });
  document.getElementById('m-faz').addEventListener('change',updSkRow);
  document.getElementById('m-tsrch').addEventListener('input',function(){filterT(this.value);});

  history.pushState(null,'');
  window.addEventListener('popstate',function(){
    history.pushState(null,'');
    var p=document.querySelector('.pg.on'); if(!p)return;
    if(p.id==='pg-scan')doSetupPg();
    else if(p.id==='pg-setup'){showPg('pg-login');loadGy();}
  });

  // Session visszaállítás
  try{
    var ses=JSON.parse(localStorage.getItem('ks2')||'null');
    if(ses&&ses.token&&(Date.now()-ses.ts)<43200000){
      S.token=ses.token;S.gy=ses.gy;S.faz=ses.faz;S.cs=ses.cs;S.sk=ses.sk;
      S.cnt=ses.cnt||0; // leolvasásszám visszaállítása
      api('getMasterData').then(function(d){S.md=d;S.termekek=(d.termekek||[]);});
      goScan(); return;
    }
  }catch(e){}

  loadGy();
});
</script>
